name: Prévisions P+R Rennes

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: Code du site
        uses: actions/checkout@v4
        with:
          path: site

      - name: Branche de données
        uses: actions/checkout@v4
        with:
          ref: data
          path: datastore

      - name: Calculer les prévisions
        working-directory: site
        run: node .github/scripts/aggregate.mjs
        env:
          DATA_DIR: ../datastore/data
          OUTPUT_FILE: pr-rennes-pwa/predictions.json

      - name: Publier si changement
        working-directory: site
        run: |
          git config user.name "pr-rennes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pr-rennes-pwa/predictions.json
          if ! git diff --quiet --cached; then
            git commit -m "Prévisions $(date -u +'%Y-%m-%d')"
            git push
          else
            echo "Rien de nouveau à committer."
          fi
