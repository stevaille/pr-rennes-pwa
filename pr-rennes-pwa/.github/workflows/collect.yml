name: Collecte P+R Rennes

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Code du site (scripts)
        uses: actions/checkout@v4
        with:
          path: site

      - name: Branche de données
        uses: actions/checkout@v4
        with:
          ref: data
          path: datastore

      - name: Relever les disponibilités
        run: node site/.github/scripts/collect.mjs
        env:
          OUTPUT_DIR: datastore/data

      - name: Committer le relevé
        working-directory: datastore
        run: |
          git config user.name "pr-rennes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if ! git diff --quiet --cached; then
            git commit -m "Relevé $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          else
            echo "Rien de nouveau à committer."
          fi
